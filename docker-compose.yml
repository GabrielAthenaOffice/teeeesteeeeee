services:
  postgres:
    image: postgres:16
    container_name: trads-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=trads
      - POSTGRES_USER=trads
      - POSTGRES_PASSWORD=trads
    ports:
      - "5444:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trads -d trads"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - trads-network

  adminer:
    image: adminer:latest
    container_name: trads-adminer
    restart: unless-stopped
    ports:
      - "8084:8080"
    depends_on:
      - postgres
    networks:
      - trads-network

  migrate:
    image: migrate/migrate:latest
    container_name: trads-migrate
    entrypoint: ["migrate"]
    command: ["-path=/migrations", "-database", "postgres://trads:trads@postgres:5432/trads?sslmode=disable", "up"]
    volumes:
      - ./backend-golang/db/migrations:/migrations
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - trads-network

  import:
    build: ./backend-golang
    image: trads-backend
    container_name: trads-import
    restart: "no"
    command: ["import"]
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgres://trads:trads@postgres:5432/trads?sslmode=disable
      - BASE_URL_IBGE=https://servicodados.ibge.gov.br/api/v3
      - BASE_URL_LOCALIDADES=https://servicodados.ibge.gov.br/api/v1
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - trads-network

  api:
    build: ./backend-golang
    image: trads-backend
    container_name: trads-api
    restart: unless-stopped
    command: ["api"]
    environment:
      - PORT=8082
      - APP_ENV=production
      - DATABASE_URL=postgres://trads:trads@postgres:5432/trads?sslmode=disable
      - BASE_URL_IBGE=https://servicodados.ibge.gov.br/api/v3
      - BASE_URL_LOCALIDADES=https://servicodados.ibge.gov.br/api/v1
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      import:
        condition: service_completed_successfully
    networks:
      - trads-network

  frontend:
    build: ./frontend
    container_name: trads-frontend
    restart: unless-stopped
    ports:
      - "8085:80"
    depends_on:
      - api
    networks:
      - trads-network


volumes:
  postgres_data:

networks:
  trads-network:
    driver: bridge